name: Build and test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore YoAIWorkflow.slnx
      - run: dotnet build YoAIWorkflow.slnx --no-restore --configuration Release
      - run: dotnet test YoAIWorkflow.slnx --no-build --configuration Release

